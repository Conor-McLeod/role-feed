<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>role-feed</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23ff5a1f'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <h1>role<span>—</span>feed</h1>
      <p class="tagline">Inference &amp; infrastructure openings, wired daily.</p>
    </div>
    <dl class="stats" id="stats" aria-live="polite"></dl>
  </header>

  <div class="layout">
    <aside class="rail">
      <form id="filters" autocomplete="off">
        <label class="field search">
          <span>Search <kbd>/</kbd></span>
          <input name="q" type="search" placeholder="inference kernels london" />
        </label>
        <label class="check"><input name="desc" type="checkbox" value="1" /> also search descriptions</label>

        <label class="field">
          <span>Exclude titles containing</span>
          <input name="exclude" type="text" placeholder="sales, recruiter, intern" />
        </label>

        <label class="field">
          <span>Location</span>
          <input name="location" type="text" placeholder="San Francisco" />
        </label>
        <label class="check"><input name="remote" type="checkbox" value="1" /> remote-friendly only</label>

        <div class="row2">
          <label class="field">
            <span>Posted within</span>
            <select name="posted">
              <option value="">any time</option>
              <option value="1">1 day</option>
              <option value="7">7 days</option>
              <option value="30">30 days</option>
              <option value="90">90 days</option>
            </select>
          </label>
          <label class="field">
            <span>Status</span>
            <select name="status">
              <option value="open">open</option>
              <option value="closed">closed</option>
              <option value="all">all</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span>Sort by</span>
          <select name="sort">
            <option value="seen">first seen by role-feed</option>
            <option value="posted">posted date</option>
          </select>
        </label>

        <fieldset class="field">
          <legend>Category</legend>
          <div class="chips" id="categories"></div>
        </fieldset>

        <fieldset class="field">
          <legend>Companies <button type="button" class="link" id="clear-companies">clear</button></legend>
          <ul class="companies" id="companies"></ul>
        </fieldset>
      </form>
    </aside>

    <main>
      <div class="toolbar">
        <p id="summary">Loading…</p>
        <div class="actions">
          <button type="button" id="mark-seen" title="Clear the NEW markers">Mark all seen</button>
          <button type="button" id="refresh" title="Re-poll every company now">Refresh now</button>
        </div>
      </div>
      <div id="feed" class="feed"></div>
      <p class="hint">Keys: <kbd>/</kbd> search · <kbd>j</kbd>/<kbd>k</kbd> move · <kbd>enter</kbd> expand · <kbd>o</kbd> open posting</p>
    </main>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
